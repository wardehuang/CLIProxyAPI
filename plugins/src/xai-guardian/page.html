<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>xAI Guardian</title>
  <style>
    :root{color-scheme:light;--ink:#202523;--muted:#6a716d;--line:#d9ddd6;--paper:#f9f8f1;--card:#fffef8;--green:#2e7659;--red:#b55050;--amber:#9c741d;--shadow:0 8px 24px rgb(0 0 0 / 5%)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1180px;margin:0 auto;padding:28px 24px 56px}.eyebrow{color:var(--green);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.hero h1{margin:5px 0 0;font-size:30px;line-height:1.1}.hero p{margin:8px 0 0;color:var(--muted)}.hero-meta{color:var(--muted);font-size:12px;text-align:right}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px}.tab{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:11px 15px;font-weight:700}.tab.active{color:var(--green);border-bottom:2px solid var(--green)}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.card{background:color-mix(in srgb,var(--card) 75%,transparent);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px;border-radius:12px}.metric{font-size:28px;font-weight:750}.metric-label{color:var(--muted);font-size:12px}.section{margin-top:16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.section-head h2{font-size:17px;margin:0}.section-head h2::before{content:"▍";color:var(--green);margin-right:6px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;padding:8px 12px;font-weight:650}.button.primary{background:var(--green);border-color:var(--green);color:white}.button.danger{color:var(--red)}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fffefb;padding:9px;color:var(--ink);font:inherit}.textarea{min-height:92px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 12px;white-space:nowrap}th{color:var(--muted);font-size:12px;font-weight:700}tr:last-child td{border-bottom:0}.state{font-weight:700}.state.healthy{color:var(--green)}.state.unhealthy,.state.degraded{color:var(--red)}.state.available{color:var(--green)}.state.unavailable{color:var(--amber)}.notice{color:var(--muted);padding:18px 4px}.error{color:var(--red);white-space:pre-wrap}.small{font-size:12px;color:var(--muted)}@media(max-width:800px){main{padding:20px 14px 40px}.hero{display:block}.hero-meta{text-align:left;margin-top:12px}.grid,.form-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.form-grid{grid-template-columns:1fr}.tabs{overflow:auto}.tab{white-space:nowrap}}
  </style>
  <style>/*__HALLMARK_TOKENS__*/</style>
</head>
<body>
<main>
  <header class="hero">
    <div><div class="eyebrow">xAI Guardian</div><h1>xAI 降智守护</h1><p>账号状态、服务端巡检、实时降智守护。</p></div>
    <div class="hero-meta" id="last-refresh">尚未刷新</div>
  </header>
  <nav class="tabs" aria-label="xAI Guardian sections">
    <button class="tab active" data-tab="accounts">账号状态</button>
    <button class="tab" data-tab="inspection">服务端巡检</button>
    <button class="tab" data-tab="guard">降智守护</button>
  </nav>

  <section class="panel active" data-panel="accounts">
    <div class="grid" id="account-metrics"><div class="card"><div class="metric">—</div><div class="metric-label">账号总数</div></div><div class="card"><div class="metric">—</div><div class="metric-label">可用账号</div></div><div class="card"><div class="metric">—</div><div class="metric-label">异常账号</div></div><div class="card"><div class="metric">—</div><div class="metric-label">降智账号</div></div></div>
    <div class="section"><div class="section-head"><h2>账号绑定</h2><button class="button" id="refresh-accounts">刷新</button></div><div id="accounts-table" class="table-wrap"><div class="notice">加载中…</div></div></div>
  </section>

  <section class="panel" data-panel="inspection">
    <div class="card"><div class="section-head"><h2>录入巡检节点</h2><button class="button primary" id="run-inspection">立即巡检</button></div><textarea class="textarea" id="node-input" placeholder="每行一个代理，例如 http://203.0.113.10:8080；也支持 host:port,出口IP,port,protocol"></textarea><div class="small">不接受带用户名或密码的代理地址。代理凭据不写入插件 SQLite。</div><div id="node-message" class="small"></div></div>
    <div class="section"><div class="section-head"><h2>节点状态</h2><button class="button" id="refresh-inspection">刷新</button></div><div id="nodes-table" class="table-wrap"><div class="notice">加载中…</div></div></div>
    <div class="section"><div class="section-head"><h2>最近巡检</h2></div><div id="inspection-run" class="card notice">加载中…</div></div>
  </section>

  <section class="panel" data-panel="guard">
    <div class="card"><div class="section-head"><h2>守护策略</h2><button class="button primary" id="save-settings">保存</button></div><div class="form-grid"><div class="field"><label for="inspection-interval">自动巡检间隔（秒，0=关闭）</label><input class="input" id="inspection-interval" type="number" min="0"></div><div class="field"><label for="first-payload-timeout">首个 payload 超时（秒）</label><input class="input" id="first-payload-timeout" type="number" min="1"></div><div class="field"><label for="progress-timeout">无进展超时（秒）</label><input class="input" id="progress-timeout" type="number" min="1"></div><div class="field"><label for="min-summary-chars">最小思考摘要字符数</label><input class="input" id="min-summary-chars" type="number" min="1"></div><div class="field"><label for="min-encrypted-bytes">最小加密思考字节数</label><input class="input" id="min-encrypted-bytes" type="number" min="1"></div><div class="field"><label for="encrypted-bytes-per-token">每个思考 token 的加密字节数</label><input class="input" id="encrypted-bytes-per-token" type="number" min="1"></div><div class="field"><label for="min-output-tokens">最小输出 token 数</label><input class="input" id="min-output-tokens" type="number" min="1"></div><div class="field"><label for="hard-tps">硬 TPS 阈值</label><input class="input" id="hard-tps" type="number" min="1"></div></div><div class="small">单请求重试上限由 CPA 核心统一控制，插件不重复限制。TTFB 仅采集，不作为降智拦截条件。</div><div id="settings-message" class="small"></div></div>
    <div class="section"><div class="section-head"><h2>降智状态</h2><button class="button" id="refresh-guard">刷新</button></div><div class="small">清除仅删除插件本地降智记录，不修改 CPA 认证优先级或认证文件。</div><div id="guard-table" class="table-wrap"><div class="notice">加载中…</div></div></div>
    <div class="section"><div class="section-head"><h2>插件日志</h2></div><div id="logs-table" class="table-wrap"><div class="notice">加载中…</div></div></div>
  </section>
</main>
<script>
(() => {
  const apiEndpoint = '/v0/management/xai-guardian/api';
  const state = {accounts: [], nodes: [], degradation: [], settings: {}};
  const $ = (id) => document.getElementById(id);
  const escapeHTML = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  async function api(path, method = 'GET', body) {
    const payload = {method, path};
    if (body !== undefined) payload.body = body;
    const response = await fetch(apiEndpoint, {method:'POST', headers:{'content-type':'application/json','X-CPA-XAI-GUARDIAN-UI':'1'}, body:JSON.stringify(payload)});
    const data = await response.json();
    if (!response.ok || data.ok === false) throw new Error(data?.error?.message || '请求失败');
    return data.data;
  }
  function setMessage(id, text, isError = false) { const node = $(id); node.textContent = text || ''; node.className = isError ? 'error' : 'small'; }
  function renderAccounts() {
    const rows = state.accounts.map((item) => `<tr><td>${escapeHTML(item.authName)}</td><td>${escapeHTML(item.authIndex)}</td><td class="state ${item.status === 'available' ? 'available' : 'unavailable'}">${escapeHTML(item.status)}</td><td>${item.priority}</td><td>${item.nodeId || '未绑定'}</td><td>${item.success}</td><td>${item.failed}</td></tr>`).join('');
    $('accounts-table').innerHTML = rows ? `<table><thead><tr><th>账号</th><th>Auth Index</th><th>状态</th><th>优先级</th><th>节点</th><th>成功</th><th>失败</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="notice">没有 xAI 账号。</div>';
    const available = state.accounts.filter((item) => item.status === 'available').length;
    const degraded = state.degradation.length;
    $('account-metrics').innerHTML = [['账号总数', state.accounts.length], ['可用账号', available], ['异常账号', state.accounts.length - available], ['降智账号', degraded]].map(([label, value]) => `<div class="card"><div class="metric">${value}</div><div class="metric-label">${label}</div></div>`).join('');
  }
  function renderNodes() {
    const rows = state.nodes.map((item) => `<tr><td>${item.id}</td><td>${escapeHTML(item.address)}</td><td class="state ${item.status}">${escapeHTML(item.status)}</td><td>${item.latencyMs || '—'} ms</td><td>${escapeHTML(item.exitIp || '—')}</td><td>${escapeHTML(item.country || '—')}</td><td>${item.lastChecked ? new Date(item.lastChecked).toLocaleString() : '—'}</td><td><button class="button danger" data-delete-node="${item.id}">删除</button></td></tr>`).join('');
    $('nodes-table').innerHTML = rows ? `<table><thead><tr><th>ID</th><th>地址</th><th>状态</th><th>延迟</th><th>出口 IP</th><th>国家</th><th>最近检查</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="notice">没有巡检节点。</div>';
  }
  function renderInspection(data) { const run = data?.run; $('inspection-run').innerHTML = run ? `<strong>Run #${run.id}</strong><br>状态：${escapeHTML(run.status)}　总数：${run.total}　健康：${run.healthy}　异常：${run.unhealthy}<br><span class="small">开始：${new Date(run.startedAt).toLocaleString()}</span>` : '尚未运行巡检。'; }
  function renderGuard() {
    const rows = state.degradation.map((item) => `<tr><td>${escapeHTML(item.authName)}</td><td>${escapeHTML(item.authIndex)}</td><td class="state degraded">${item.count}</td><td>${escapeHTML(item.lastReason)}</td><td>${item.lastSeen ? new Date(item.lastSeen).toLocaleString() : '—'}</td><td><button class="button" data-clear-auth="${escapeHTML(item.authIndex)}">清除</button></td></tr>`).join('');
    $('guard-table').innerHTML = rows ? `<table><thead><tr><th>账号</th><th>Auth Index</th><th>次数</th><th>原因</th><th>最近发生</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="notice">没有降智记录。</div>';
  }
  function renderLogs(items) { const rows = (items || []).map((item) => `<tr><td>${new Date(item.createdAt).toLocaleString()}</td><td>${escapeHTML(item.level)}</td><td>${escapeHTML(item.event)}</td><td>${escapeHTML(item.message)}</td></tr>`).join(''); $('logs-table').innerHTML = rows ? `<table><thead><tr><th>时间</th><th>级别</th><th>事件</th><th>消息</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="notice">没有日志。</div>'; }
  async function refreshAccounts() { try { state.accounts = await api('/api/accounts'); renderAccounts(); } catch (error) { $('accounts-table').innerHTML = `<div class="error">${escapeHTML(error.message)}</div>`; } }
  async function refreshInspection() { try { const [nodes, inspection] = await Promise.all([api('/api/nodes'), api('/api/inspection')]); state.nodes = nodes; renderNodes(); renderInspection(inspection); } catch (error) { $('nodes-table').innerHTML = `<div class="error">${escapeHTML(error.message)}</div>`; } }
  async function refreshGuard() { try { const [degradation, settings, logs] = await Promise.all([api('/api/degradation'), api('/api/settings'), api('/api/logs')]); state.degradation = degradation; state.settings = settings; $('inspection-interval').value = settings.inspectionIntervalSeconds; $('first-payload-timeout').value = settings.firstPayloadTimeout; $('progress-timeout').value = settings.progressTimeout; $('min-summary-chars').value = settings.minSummaryChars; $('min-encrypted-bytes').value = settings.minEncryptedBytes; $('encrypted-bytes-per-token').value = settings.encryptedBytesPerToken; $('min-output-tokens').value = settings.minOutputTokens; $('hard-tps').value = settings.hardTPS; renderGuard(); renderLogs(logs); if (state.accounts.length) renderAccounts(); } catch (error) { $('guard-table').innerHTML = `<div class="error">${escapeHTML(error.message)}</div>`; } }
  async function refreshAll() { await Promise.all([refreshAccounts(), refreshInspection(), refreshGuard()]); $('last-refresh').textContent = `最近刷新：${new Date().toLocaleString()}`; }
  document.querySelectorAll('.tab').forEach((button) => button.addEventListener('click', () => { document.querySelectorAll('.tab').forEach((item) => item.classList.toggle('active', item === button)); document.querySelectorAll('.panel').forEach((item) => item.classList.toggle('active', item.dataset.panel === button.dataset.tab)); }));
  $('refresh-accounts').addEventListener('click', async () => { try { await api('/api/accounts/refresh', 'POST', {}); await refreshAccounts(); } catch (error) { $('accounts-table').innerHTML = `<div class="error">${escapeHTML(error.message)}</div>`; } }); $('refresh-inspection').addEventListener('click', refreshInspection); $('refresh-guard').addEventListener('click', refreshGuard);
  $('run-inspection').addEventListener('click', async () => { setMessage('node-message', '巡检中…'); try { const text = $('node-input').value.trim(); if (text) { await api('/api/nodes', 'POST', {text}); $('node-input').value = ''; } await api('/api/inspection', 'POST', {}); await refreshInspection(); setMessage('node-message', '巡检完成。'); } catch (error) { setMessage('node-message', error.message, true); } });
  $('save-settings').addEventListener('click', async () => { try { await api('/api/settings', 'PUT', {inspectionIntervalSeconds:Number($('inspection-interval').value), firstPayloadTimeout:Number($('first-payload-timeout').value), progressTimeout:Number($('progress-timeout').value), minSummaryChars:Number($('min-summary-chars').value), minEncryptedBytes:Number($('min-encrypted-bytes').value), encryptedBytesPerToken:Number($('encrypted-bytes-per-token').value), minOutputTokens:Number($('min-output-tokens').value), hardTPS:Number($('hard-tps').value)}); setMessage('settings-message', '已保存。'); } catch (error) { setMessage('settings-message', error.message, true); } });
  $('node-input').addEventListener('change', () => setMessage('node-message', ''));
  document.addEventListener('click', async (event) => { const deleteButton = event.target.closest('[data-delete-node]'); if (deleteButton) { try { await api(`/api/nodes/${deleteButton.dataset.deleteNode}/delete`, 'POST', {}); await refreshInspection(); } catch (error) { setMessage('node-message', error.message, true); } } const clearButton = event.target.closest('[data-clear-auth]'); if (clearButton) { try { await api('/api/degradation/clear', 'POST', {authIndex:clearButton.dataset.clearAuth}); await refreshGuard(); await refreshAccounts(); } catch (error) { setMessage('settings-message', error.message, true); } } });
  refreshAll();
})();
</script>
</body>
</html>
